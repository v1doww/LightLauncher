plugins { id 'com.android.application' }
android {
    buildFeatures { buildConfig true }
    namespace 'com.android.lightlauncher'
    compileSdk 36
    defaultConfig {
        applicationId 'com.android.lightlauncher'
        minSdk 25
        targetSdk 28
        versionCode 2
        versionName '1.1'
        buildConfigField 'String', 'BUILD_DATE', '"' + new Date().format('yyyy-MM-dd', TimeZone.getTimeZone('UTC')) + '"'
        manifestPlaceholders = [appLabel: 'LightLauncher']
    }
    flavorDimensions += 'orientation'
    productFlavors {
        tv {
            dimension 'orientation'
        }
        portrait {
            dimension 'orientation'
            applicationIdSuffix '.portrait'
            versionNameSuffix '-portrait'
            manifestPlaceholders = [appLabel: 'LightLauncher Portrait']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
