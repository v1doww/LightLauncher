plugins { id 'com.android.application' }
android {
    namespace 'com.android.lightlauncher'
    compileSdk 36
    defaultConfig {
        applicationId 'com.android.lightlauncher'
        minSdk 25
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
